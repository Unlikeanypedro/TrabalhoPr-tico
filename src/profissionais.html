    <main id="conteudo">
        <p class="caminho">inicio > Profissionais</p>
        <div class="titulo-pagina">
            <h1>Profissionais</h1>
            <a class="botao" href="#"> #</a>
        </div>

        <section class="painel">
            <h2>Procurar profissional</h2>
            <form id="formulario-filtro" class="filtros" action="#">
                <label for="filtro-nome">Nome
                    <input type="search" id="filtro-nome" name="filtro-nome" placeholder="''Pedro Samuel''" />
                </label>

                <label for="filtro-cidade">Cargo
                    <input type="text" id="filtro-cargo" name="filtro-cargo" placeholder="''Secretario''" />
                </label>

                <div class="botoes">
                    <button type="button" class="secundario" id="botao-limpar-filtros">
                        Limpar
                    </button>
                </div>
            </form>
        </section>
        <label for="filtro-ordem">Ordenar por
            <select id="filtro-ordem" name="filtro-ordem">
                <option>Nome (A–Z)</option>
                <option>Nome (Z–A)</option>
            </select>
        </label>
    </main>
